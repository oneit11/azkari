<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>أذكاري</title>
<style>
@font-face{font-family:"Amiri";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/amiri-arabic-400-normal.woff2) format("woff2")}
@font-face{font-family:"Amiri";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/amiri-arabic-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2) format("woff2")}

<style>
/* VOICE: calm, reverent, quiet; the words of dhikr lead, everything else steps back.
   IDEA: a pocket prayer book — a hand counter on every page.
   PICTURE: navy band with a faint eight-point star lattice holding the next prayer and its countdown.
   COLOUR and TYPE: navy primary, one coloured tile per section; Amiri for dhikr text, IBM Plex Sans Arabic for the interface.
   LAYOUT: one column up to 760px, sticky top bar, bottom navigation, cards you tap to count. */
:root{color-scheme:light dark;--bg:light-dark(#f4f6fb,#0b1020);--card:light-dark(#fff,#141b30);--ink:light-dark(#111827,#e8ecf6);--mut:light-dark(#5b6478,#9aa4bd);--line:light-dark(#e3e7f0,#232c46);--pri:#1e3a8a;--pri2:light-dark(#1e3a8a,#8fb0ff);--band:light-dark(#1e3a8a,#101a3d);--ok:#059669}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:clip;padding-bottom:84px}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top);z-index:5;background:var(--band);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:19px;margin:0;flex:1}
.ib{min-width:44px;min-height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.ib svg{width:22px;height:22px}
.ib:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.hero{position:relative;background:var(--band);color:#fff;padding:18px 0 30px;overflow:hidden}
.hero svg.pat{position:absolute;inset:0;width:100%;height:100%;opacity:.13}
.hero .wrap{position:relative}
.dates{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;opacity:.9}
.next{margin-top:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:18px}
.next small{font-size:14px;opacity:.85}
.next .nm{font-size:clamp(30px,8vw,44px);font-weight:700;line-height:1.1;margin:2px 0}
.next .cd{font-size:clamp(22px,6vw,30px);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.row6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:14px}
.row6 div{text-align:center;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 2px;font-size:13px}
.row6 b{display:block;font-size:14px;white-space:nowrap}
.row6 .on{background:#f59e0b;color:#111}
.hint{margin:-14px 0 0;position:relative;z-index:2}
.hint button{width:100%;text-align:start;border:0;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 6px 20px rgba(15,28,63,.12);cursor:pointer;display:flex;gap:12px;align-items:center}
.ded{margin:16px 0 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;font-size:15px;line-height:1.8}
.ded b{display:block;color:var(--pri2);font-size:17px;margin-bottom:2px}
.ppl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 4px}
@media(max-width:480px){.ppl{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}}
.ppl figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.ppl img,.ppl .ph{width:clamp(72px,22vw,96px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid var(--pri2);box-shadow:0 4px 14px rgba(15,28,63,.18)}
.ppl .ph{display:grid;place-items:center;background:var(--pri)}.ppl .ph svg{width:34px;height:34px}
.ppl figcaption{font-size:14px;line-height:1.5;font-weight:500}
.ded .dua{font-family:Amiri,serif;font-size:19px;margin:8px 0 4px;color:var(--ink)}
.ded small{color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.tile{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:108px;font-weight:500;font-size:15px;text-align:center}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.ic svg{width:24px;height:24px}
h2{font-size:24px;line-height:1.2;margin:18px 0 6px}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 14px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 12px;overflow:hidden;transition:opacity .3s}
.card.done{opacity:.55}
.tap{display:block;width:100%;border:0;background:transparent;text-align:start;padding:16px 16px 10px;cursor:pointer}
.txt{font-family:Amiri,serif;font-size:var(--fs,22px);line-height:2;white-space:pre-line}
.txt.q{color:var(--pri2)}
.pre{font-size:14px;color:var(--mut);margin-bottom:4px}
.fadl{font-size:14px;color:var(--mut);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.foot{display:flex;align-items:center;gap:6px;padding:6px 10px 10px 12px;flex-wrap:wrap}
.chip{font-size:13px;border-radius:999px;padding:3px 10px;background:light-dark(#eef2ff,#1c2645);color:var(--pri2)}
.chip.g{background:light-dark(#e7f7f0,#0f2a22);color:var(--ok)}
.sp{flex:1}
.cnt{min-width:64px;height:44px;border-radius:12px;background:var(--pri);color:#fff;border:0;font-weight:700;font-size:17px;cursor:pointer;font-variant-numeric:tabular-nums}
.done .cnt{background:var(--ok)}
.fav.on svg{fill:#db2777;stroke:#db2777}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0 16px}
select,input[type=search]{min-height:48px;font-size:16px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px solid var(--line);font-size:17px}
td:last-child{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
tr.on td{background:light-dark(#fff7e6,#2a2210)}
.tg{display:flex;gap:10px;align-items:center;min-height:48px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin:0 0 10px;font-size:15px}.tg input{width:22px;height:22px;accent-color:var(--pri)}
.compass{max-width:300px;margin:10px auto}
.big{font-size:44px;font-weight:700;text-align:center;line-height:1.1;margin:4px 0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.btn svg{width:18px;height:18px;flex:none}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:center;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
nav.bn{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.bn .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.bn button{border:0;background:transparent;min-height:62px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mut)}
nav.bn button.on{color:var(--pri2);font-weight:700}
nav.bn svg{width:22px;height:22px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.toast.show{opacity:1}
.note{font-size:13px;color:var(--mut);margin:18px 0}

.banner{width:100%;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin-top:12px;cursor:pointer;display:flex;gap:12px;align-items:center}
.banner small{color:var(--mut)}
.daily{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.dl{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px 14px}
.dl .txt{font-size:20px;line-height:1.9}.dl small{color:var(--mut);font-size:13px}
.dh{display:flex;align-items:center;justify-content:space-between}.dh b{color:var(--pri2)}
@media(max-width:600px){.daily{grid-template-columns:minmax(0,1fr)}}
td.adj{text-align:center;white-space:nowrap;font-weight:400}
td.adj button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px}
td.adj span{display:inline-block;min-width:34px;text-align:center;font-size:14px;color:var(--mut)}
.streak{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--ok)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:12px 0 16px;text-align:center;font-size:12px;color:var(--mut)}
.dd i{display:block;width:26px;height:26px;margin:0 auto 4px;border-radius:50%;border:2px solid var(--line)}
.dd.on i{background:var(--ok);border-color:var(--ok)}
.witem{width:100%;display:flex;align-items:center;gap:12px;text-align:start;min-height:56px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;margin-bottom:8px;cursor:pointer;font-size:16px}
.witem small{margin-inline-start:auto;color:var(--mut);font-size:13px}
.wc{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.wc svg{width:18px;height:18px}.witem.on .wc{background:var(--ok);border-color:var(--ok);color:#fff}
.cfg{margin-top:16px}.cfg summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:500;color:var(--pri2)}
.cfg input[type=number]{min-height:48px;font-size:16px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;width:140px}
.bead{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:min(78vw,300px);aspect-ratio:1;margin:10px auto;border-radius:50%;border:0;cursor:pointer;color:#fff;background:radial-gradient(circle at 35% 30%,#3b5bdb,#1e3a8a 60%,#14275e);box-shadow:0 14px 30px rgba(15,28,63,.35),inset 0 -8px 18px rgba(0,0,0,.25);touch-action:manipulation;user-select:none}
.bead:active{transform:scale(.97)}
.bead .ph{font-family:Amiri,serif;font-size:22px;padding:0 24px;text-align:center;line-height:1.5}
.bead .bc{font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.bead .bg{font-size:14px;opacity:.8}
.kids .card{border-width:2px;border-color:#fdba74}.kids .txt{font-size:calc(var(--fs,22px) + 4px)}
.starbox{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff7ed;color:#c2410c;border-radius:18px;padding:12px;font-size:18px;margin-bottom:8px}
.starbox svg{width:34px;height:34px;fill:#f59e0b;stroke:#f59e0b}.starbox b{font-size:32px}
:root[data-theme=dark] .starbox{background:#2a1a0c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .starbox{background:#2a1a0c}}
.juzg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0}
.juz{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:64px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.juz b{font-size:18px}.juz small{font-size:11px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.juz.tk{background:light-dark(#eef2ff,#1c2645)}.juz.mine{background:#f59e0b;color:#111;border-color:#f59e0b}.juz.mine small{color:#111}
.juz.dn{background:var(--ok);color:#fff;border-color:var(--ok)}.juz.dn small{color:#fff}
h3{font-size:18px;margin:18px 0 4px}
.modal{position:fixed;inset:0;background:rgba(10,16,32,.6);z-index:20;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.mbox{position:relative;background:var(--card);border-radius:20px;padding:44px 16px 16px;width:min(100%,460px);max-height:90vh;overflow:auto}
.mx{position:absolute;top:4px;inset-inline-end:4px}
.intro{position:fixed;inset:0;z-index:30;background:var(--band);color:#fff;display:grid;place-items:center;padding:24px;text-align:center;transition:opacity .45s}
.intro[hidden]{display:none}.intro.out{opacity:0}
.iw b{display:block;font-size:clamp(24px,7vw,34px);margin-bottom:18px;color:#fbbf24}
.ippl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px;max-width:420px;margin:0 auto}
.ippl figure{margin:0}.ippl img{width:clamp(96px,30vw,128px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.ippl figcaption{font-size:14px;line-height:1.5;margin-top:6px}
.idua{font-family:Amiri,serif;font-size:20px;line-height:1.9;margin:18px auto 8px;max-width:440px}
.intro small{opacity:.7}

.player{position:fixed;inset-inline:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:7;background:var(--band);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 10px;box-shadow:0 -4px 14px rgba(0,0,0,.2)}
.player .ib svg{stroke:#fff}.player .pi{flex:1;display:flex;flex-direction:column;min-width:0}
.player .pt{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player .ps{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player input{width:100%;accent-color:#f59e0b;height:18px}
body.hasp{padding-bottom:150px}
body.hasp .toast{bottom:160px}
.srow{display:flex;align-items:center;gap:4px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:4px 6px;text-align:start;cursor:pointer}
.sgo{flex:1;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:start;min-height:52px;cursor:pointer;padding:0 6px}
button.srow.sgo{padding:4px 12px}
.sgo b{display:block;font-size:17px}.sgo small{color:var(--mut);font-size:13px}
.sn{width:38px;height:38px;flex:none;border-radius:10px;background:light-dark(#ecfdf5,#0f2a22);color:#047857;display:grid;place-items:center;font-weight:700;font-size:14px}
.ib.ok{color:var(--ok)}
.dlbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:14px;color:var(--mut)}
.mushaf{background:light-dark(#fffdf6,#151a2b);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-top:12px}
.mushaf p{margin:0;font-family:Amiri,serif;font-size:calc(var(--fs,22px) + 2px);line-height:2.3;text-align:justify}
.basm{text-align:center;font-family:Amiri,serif;font-size:24px;margin-bottom:8px;color:var(--pri2)}
.aya{cursor:pointer;border-radius:6px}.aya.bm{background:light-dark(#fef3c7,#3a2e0c)}
.an{color:#b45309;font-size:.8em;white-space:nowrap}
.snav{display:flex;justify-content:space-between;gap:8px;margin:14px 0}
.hcard .txt{font-size:calc(var(--fs,22px) - 2px)}

.steps{padding-inline-start:22px;line-height:2}
@media(min-width:700px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}.ded .ppl,.ppl{gap:18px}.juzg{grid-template-columns:repeat(6,minmax(0,1fr))}.player{inset-inline:max(0px,calc(50% - 380px))}}
@media(min-width:1000px){.wrap{max-width:900px}.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}.daily{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:360px){body{font-size:15px}.top h1{font-size:17px}.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile{padding:10px 4px;min-height:96px;font-size:13px}.ic{width:40px;height:40px}.next .nm{font-size:28px}.row6{gap:4px}.row6 div{padding:6px 1px;font-size:11px}.row6 b{font-size:11px}.juzg{gap:5px}.juz b{font-size:15px}nav.bn button{font-size:11px}.ppl figcaption{font-size:12px}}
@media(orientation:landscape) and (max-height:500px){.hero{padding:10px 0 24px}.next{padding:10px 14px}.bead{width:min(48vh,260px)}}
@media(max-width:420px){.row6 div{font-size:12px}.row6 b{font-size:12px}.tiles{gap:8px}.tile{font-size:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="ib" id="back" aria-label="رجوع" hidden><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
  <h1 id="ttl">أذكاري</h1>
  <button class="ib" id="fsz" aria-label="حجم الخط"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 19l5-14 5 14M6 14h6M16 19l3-8 3 8M17 16h4"/></svg></button>
</div></header>
<main id="app"></main>
<nav class="bn"><div class="wrap" id="bn"></div></nav>
<div class="toast" id="toast"></div>

<div class="modal" id="modal" hidden></div>
<div class="intro" id="intro" hidden></div>

<script>
{
const I={
sun:'<path d="M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4"/><circle cx="12" cy="12" r="4.5"/>',
moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
bed:'<path d="M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.8"/>',

function pTimes(y,m,d,lat,lng){
 const jd=jul(y,m,d)-lng/(15*24);
 const mid=t=>fix(12-sunP(jd+t).eqt,24);
 const ang=(a,t,ccw)=>{const dec=sunP(jd+t).dec,x=(-Math.sin(rad(a))-Math.sin(rad(dec))*Math.sin(rad(lat)))/(Math.cos(rad(dec))*Math.cos(rad(lat)));const T=deg(Math.acos(Math.max(-1,Math.min(1,x))))/15;return mid(t)+(ccw?-T:T)};

 let t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18,isha:18};
 for(let i=0;i<2;i++){const p=k=>t[k]/24;t={fajr:ang(19.5,p('fajr'),1),sunrise:ang(0.833,p('sunrise'),1),dhuhr:mid(p('dhuhr')),asr:asr(p('asr')),maghrib:ang(0.833,p('maghrib')),isha:ang(17.5,p('isha'))}}
 const base=Date.UTC(y,m-1,d),o={};
 for(const k in t){o[k]=Math.round((base+(t[k]-lng/15)*3600e3)/60000)*60000}

function wrapLines(ctx,text,maxW){const words=text.split(' '),lines=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);return lines}
async function drawCard(title,text,ref){
 try{await document.fonts.load('60px Amiri');await document.fonts.load('700 40px "IBM Plex Sans Arabic"')}catch(e){}
 const W=1080,cv=document.createElement('canvas');cv.width=W;cv.height=W;const x=cv.getContext('2d');
 x.fillStyle='#1e3a8a';x.fillRect(0,0,W,W);x.strokeStyle='rgba(255,255,255,.09)';x.lineWidth=3;
 for(let i=0;i<W;i+=120)for(let j=0;j<W;j+=120){x.strokeRect(i+36,j+36,48,48);x.save();x.translate(i+60,j+60);x.rotate(Math.PI/4);x.strokeRect(-24,-24,48,48);x.restore()}
 x.fillStyle='#fff';x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=2;x.strokeRect(50,50,W-100,W-100);
 x.direction='rtl';x.textAlign='center';x.fillStyle='#f59e0b';x.font='700 44px "IBM Plex Sans Arabic",sans-serif';x.fillText(title,W/2,150);
 let fs=66,lines;do{x.font=fs+'px Amiri,serif';lines=wrapLines(x,text,W-220);fs-=4}while(lines.length*fs*1.9>400&&fs>28);
 const lh=(fs+4)*1.9,top=390-lines.length*lh/2+lh*.6;x.fillStyle='#fff';lines.forEach((l,i)=>x.fillText(l,W/2,top+i*lh));
 x.font='500 34px "IBM Plex Sans Arabic",sans-serif';x.fillStyle='rgba(255,255,255,.85)';x.fillText(ref,W/2,650);
 x.fillStyle='rgba(255,255,255,.25)';x.fillRect(200,690,W-400,2);
 x.font='700 34px "IBM Plex Sans Arabic",sans-serif';x.fillStyle='#f59e0b';x.fillText('صدقة جارية على روح',W/2,750);
 const n=PEOPLE.length,gap=(W-160)/n;
 for(let i=0;i<n;i++){const cx=W-80-gap*(i+.5),cy=840,r=58,pp=PEOPLE[i];
  x.save();x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.closePath();x.fillStyle='#16307a';x.fill();
  if(pp.p){const im=await new Promise(res=>{const m=new Image();m.onload=()=>res(m);m.onerror=()=>res(null);m.src=pp.p});if(im){x.clip();x.drawImage(im,cx-r,cy-r,r*2,r*2)}}
  x.restore();x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.strokeStyle='#fff';x.lineWidth=4;x.stroke();
  x.fillStyle='#fff';x.font='500 21px "IBM Plex Sans Arabic",sans-serif';
  const nl=wrapLines(x,pp.n,gap-40);nl.slice(0,2).forEach((l,j)=>x.fillText(l,cx,cy+r+34+j*27))}
 x.font='24px "IBM Plex Sans Arabic",sans-serif';x.fillStyle='rgba(255,255,255,.55)';x.fillText('أذكاري',W/2,W-74);
 return cv.toDataURL('image/png');
}

const tickT=setInterval(()=>{if(view==='home'){const el=$('#cd');if(el&&el.dataset.k!==String(nextPrayer().ms)&&el.dataset.k){render();return}if(el)el.dataset.k=String(nextPrayer().ms);tick()}},1000);

function upd(art){
 const id=art.dataset.id,n=+art.dataset.n,c=counts[id]||0,done=c>=n;
 art.classList.toggle('done',done);art.querySelector('.cnt').textContent=done?'✓':ar(n-c);
 const p=document.querySelector('.prog i');if(p&&SEC[view]){const pr=progress(listOf(view));p.style.width=pr.p+'%';const sub=document.querySelector('.sub');if(sub&&SEC[view].sub)sub.textContent=SEC[view].sub+' · خلصت '+ar(pr.dn)+' من '+ar(pr.tot)}
 autoMark(view);if(view==='kids'&&done)giveStar(id);
}
document.addEventListener('click',e=>{
 const go=e.target.closest('[data-go]');if(go){location.hash=go.dataset.go;return}
 const cat=e.target.closest('[data-cat]');if(cat){duaCat=cat.dataset.cat;render();return}
 const hb=e.target.closest('[data-hb]');if(hb){hbook=hb.dataset.hb;store.set('hbook',hbook);hf='';render();return}
 const sea=e.target.closest('[data-sea]');if(sea){seaK=sea.dataset.sea;render();return}
 const sbi=e.target.closest('[data-sbi]');if(sbi){sb.i=+sbi.dataset.sbi;sb.c=0;store.set('sb',sb);render();return}
 const md=e.target.closest('[data-mood]');if(md){moodQ=md.dataset.mood;$('#mq').value=moodQ;renderMood();return}
 if(e.target.id==='modal'){e.target.hidden=true;return}
 const a=e.target.closest('[data-a]');if(!a)return;const art=a.closest('.card'),act=a.dataset.a;
 if(act==='gps'){useGPS();return}
 if(act==='install'){if(instEvt){instEvt.prompt();instEvt.userChoice.finally(()=>{instEvt=null;render()})}else modal('<h3>تثبيت على الآيفون</h3><ol class="steps"><li>افتح الصفحة من متصفح Safari</li><li>اضغط زرار المشاركة (المربع اللي طالع منه سهم) تحت</li><li>اختار «إضافة إلى الشاشة الرئيسية»</li><li>اضغط «إضافة» فوق</li></ol>');return}
 if(act==='compass'){DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted'){window.addEventListener('deviceorientation',onOri,true);toast('البوصلة اشتغلت')}}).catch(()=>toast('محتاج إذن البوصلة'));return}
 if(act==='mclose'){$('#modal').hidden=true;return}
 if(act==='copytxt'){copyText(decodeURIComponent(a.dataset.t));return}
 if(act==='share'){shareDaily(a.dataset.k);return}
 if(act==='adj'){const k=a.dataset.k;adj[k]=Math.max(-30,Math.min(30,(adj[k]||0)+(+a.dataset.d)));store.set('adj',adj);render();resched();return}
 if(act==='wtog'){const k=a.dataset.k,d=dkey();hist[d]=hist[d]||{};if(hist[d][k])delete hist[d][k];else{markW(k)}store.set('h',hist);render();return}
 if(act==='bead'){sb.c++;sb.tot[sb.i]=(sb.tot[sb.i]||0)+1;if(sb.day!==dkey()){sb.day=dkey();sb.dn=0}sb.dn++;store.set('sb',sb);if(sb.dn===100)markW('sebha');
  const hit=sb.goal&&sb.c%sb.goal===0;try{navigator.vibrate&&navigator.vibrate(hit?[40,60,40]:12)}catch(er){}
  $('#bc').textContent=ar(sb.c);$('#btot').textContent='المجموع الكلي: '+ar(sb.tot[sb.i]);if(hit)toast('ما شاء الله، كمّلت '+ar(sb.goal));return}
 if(act==='sbreset'){sb.c=0;store.set('sb',sb);render();return}
 if(act==='play'&&art){playZikr(art.dataset.id);return}
 if(act==='juz'){const j=+a.dataset.j,dn=kt.done.includes(j);modal(`<h3>الجزء ${ar(j)}</h3><div style="display:grid;gap:10px"><button class="btn" data-a="ktog" data-j="${j}">${svg(dn?'undo':'check')} ${dn?'لسه ما خلصتوش':'خلّصته'}</button>${ONL?`<button class="btn" data-go="quran-${JUZ_S[j-1]}">${svg('book')} افتحه في المصحف</button>`:''}</div>`);return}
 if(act==='ktog'){$('#modal').hidden=true;ktToggle(+a.dataset.j);return}
 if(act==='ktshare'){const t='ختمتي في تطبيق أذكاري: خلصت '+ar(kt.done.length)+' من ٣٠ جزء'+(kt.rounds?' (ختمات كاملة: '+ar(kt.rounds)+')':'')+'\nادعوا لأصحاب الصدقة الجارية بالرحمة والمغفرة';if(NATIVE&&P.Share){P.Share.share({text:t}).catch(()=>copyText(t));return}copyText(t);return}
 if(act==='ktreset'){kt={done:[],rounds:kt.rounds};store.set('kt',kt);render();return}
 if(act==='loadrec'){loadReciters();return}
 if(act==='dlall'){dlAll();render();return}
 if(act==='splay'){playSurah(+a.dataset.n);return}
 if(act==='sdl'){a.disabled=true;toast('بيحمّل...');dlSurah(+a.dataset.n).then(()=>render());return}
 if(act==='sdel'){delSurah(+a.dataset.n).then(()=>{toast('اتمسح التحميل');render()});return}
 if(act==='sretry'){loadSurah(+a.dataset.n);return}
 if(act==='bmk'){bm={s:+a.dataset.n,a:+a.dataset.i};store.set('bm',bm);document.querySelectorAll('.aya.bm').forEach(x=>x.classList.remove('bm'));a.classList.add('bm');toast('اتحفظ مكان وقوفك');return}
 if(act==='ptog'){if(aud.paused)aud.play().catch(()=>{});else aud.pause();return}
 if(act==='pclose'){closePlayer();return}
 if(act==='hmore'){hshow+=20;renderHList();return}
 if(act==='hretry'){const m=view.split('-');loadHSec(m[1],+m[2]);return}
 if(act==='hcopy'||act==='hshare'||act==='hfav'){const c=a.closest('.hcard'),b=c.dataset.b,n=+c.dataset.hn;
  if(act==='hcopy'){const h=findH(b,n);if(h)copyText(hText(h)+'\nرواه '+HB[b].t.replace('صحيح ','')+' ('+ar(n)+')');return}
  if(act==='hshare'){shareHadith(b,n);return}
  const i=hfav.findIndex(x=>x.b===b&&x.n===n);if(i>=0)hfav.splice(i,1);else{const h=findH(b,n);if(h)hfav.push({b,n,t:h.text})}store.set('hfav',hfav);a.classList.toggle('on');toast(i>=0?'اتشال من المفضلة':'اتضاف للمفضلة');return}
 if(act==='reset'){const k=a.dataset.k;listOf(k).forEach(x=>delete counts[x.id]);store.set('c',counts);render();toast('تمت إعادة العدّ');return}
 if(!art)return;const id=art.dataset.id,n=+art.dataset.n;
 if(act==='tap'){const c=counts[id]||0;if(c>=n)return;counts[id]=c+1;store.set('c',counts);upd(art);try{navigator.vibrate&&navigator.vibrate(c+1>=n?[30,40,30]:15)}catch(er){}
  if(c+1>=n&&SEC[view]&&view!=='duas'){const nx=art.nextElementSibling;if(nx&&nx.classList.contains('card'))setTimeout(()=>nx.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'}),250)}}
 if(act==='fav'){favs=favs.includes(id)?favs.filter(f=>f!==id):[...favs,id];store.set('f',favs);a.classList.toggle('on');toast(favs.includes(id)?'اتضاف للمفضلة':'اتشال من المفضلة')}
 if(act==='copy'){const t=art.querySelector('.txt').textContent+'\n'+art.querySelector('.g').textContent;try{navigator.clipboard.writeText(t).then(()=>toast('اتنسخ'),()=>toast('النسخ مش متاح هنا'))}catch(er){toast('النسخ مش متاح هنا')}}
});
$('#back').addEventListener('click',()=>{location.hash='home'});
$('#fsz').addEventListener('click',()=>{fs=fs>=30?18:fs+4;store.set('fs',fs);document.documentElement.style.setProperty('--fs',fs+'px');toast('حجم الخط: '+ar(fs))});
window.addEventListener('hashchange',render);
{const r=$('#prange');r.addEventListener('input',()=>{r.dataset.drag=1});r.addEventListener('change',()=>{if(aud.duration)aud.currentTime=r.value/1000*aud.duration;delete r.dataset.drag})}
render();
intro();
if(PWA){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;if(view==='home')render()});window.addEventListener('appinstalled',()=>{instEvt=null;toast('أذكاري اتثبت على موبايلك');if(view==='home')render()});
 window.addEventListener('deviceorientationabsolute',onOri,true);if(isIOS&&!(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission))window.addEventListener('deviceorientation',onOri,true);
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}
if(NATIVE){window.addEventListener('deviceorientationabsolute',onOri,true);resched();
 try{P.LocalNotifications.addListener('localNotificationActionPerformed',x=>{const g=x.notification&&x.notification.extra&&x.notification.extra.go;if(g)location.hash=g})}catch(e){}
 try{P.App.addListener('backButton',()=>{if(view!=='home')location.hash='home';else P.App.exitApp()});P.App.addListener('resume',()=>{render();resched()})}catch(e){}}
}
</script>
